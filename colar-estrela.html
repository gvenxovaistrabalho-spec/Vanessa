<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Colar Estrela com Zircônias</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#2a0d1c;--ink:#fff;--rose:#ff8fc2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);font-family:Jost,system-ui,sans-serif;color:var(--ink)}
body{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px}
.stage{position:relative;overflow:hidden;width:min(100vw,68vh);aspect-ratio:3/4;background:#000;border-radius:14px}
.cam{position:absolute;left:0;top:0;width:100%;height:100%;transform-origin:0 0;transition:transform 2.6s cubic-bezier(.6,0,.25,1)}
.cam img{width:100%;height:100%;display:block}
.sp{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;opacity:0;pointer-events:none;
 background:radial-gradient(circle,#fff 0 12%,transparent 14%),conic-gradient(from 0deg,transparent 0 44%,#fff 49% 51%,transparent 56% 94%,transparent);
 clip-path:polygon(50% 0,58% 42%,100% 50%,58% 58%,50% 100%,42% 58%,0 50%,42% 42%);background:#fff;filter:drop-shadow(0 0 5px #fff) drop-shadow(0 0 12px var(--rose));animation:tw 2.2s ease-in-out infinite}
.sp.big{width:44px;height:44px;margin:-22px 0 0 -22px}
@keyframes tw{0%,100%{opacity:0;transform:scale(.2) rotate(0)}50%{opacity:1;transform:scale(1) rotate(45deg)}}
.cap{position:absolute;left:0;right:0;bottom:0;padding:48px 24px 28px;text-align:center;background:linear-gradient(transparent,rgba(42,13,28,.82));opacity:0;transition:opacity .8s}
.cap.on{opacity:1}
.cap h1{margin:0;font:italic 600 clamp(28px,7vw,44px)/1.1 "Cormorant Garamond",Georgia,serif}
.cap p{margin:8px 0 0;font-size:clamp(14px,3.4vw,17px);letter-spacing:.02em}
.cta{display:inline-block;margin-top:14px;padding:10px 22px;border-radius:99px;background:#fff;color:#8a1450;font-weight:500;text-decoration:none}
.bar{position:absolute;left:0;top:0;height:3px;background:var(--rose);width:0}
.ctl{display:flex;gap:10px}
button{font:inherit;color:#fff;background:transparent;border:1px solid rgba(255,255,255,.4);border-radius:99px;padding:8px 18px;cursor:pointer}
button:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
</style></head><body>

 <div class="bar" id="bar"></div>
 <div class="cap" id="cap"><h1 id="t"></h1><p id="s"></p><a class="cta" id="cta" href="#" hidden>Quero o meu</a></div>
</div>
<div class="ctl"><button id="pp">Pausar</button><button id="rp">Reiniciar</button></div>
<script>
const P=[[36.6,43.5],[40.8,49.7],[45,53],[51,60.8],[57.5,52.5],[62.2,49.2],[65.6,45],[54,58.5],[48,62]];
P.forEach((p,i)=>{const e=document.createElement('div');e.className='sp'+(i==3?' big':'');
 e.style.left=p[0]+'%';e.style.top=p[1]+'%';e.style.animationDelay=(i*.35)+'s';document.getElementById('cam').appendChild(e)});
const cam=document.getElementById('cam'),st=document.getElementById('st'),cap=document.getElementById('cap'),
T=document.getElementById('t'),S=document.getElementById('s'),CTA=document.getElementById('cta'),bar=document.getElementById('bar');
const scenes=[
 {x:50,y:50,z:1,t:'Colar Estrela',s:'Prata com zircônias',d:3800},
 {x:51,y:60.8,z:2.8,t:'Um pingente de estrela',s:'Contorno cravejado de zircônias',d:4600},
 {x:51,y:50,z:2,t:'Pontos de luz',s:'Seis zircônias soltas ao longo da corrente',d:4600},
 {x:50,y:50,z:1,t:'Delicadeza que brilha',s:'Para usar todos os dias',d:4200,cta:1}
];
const total=scenes.reduce((a,c)=>a+c.d,0);
let i=0,timer,paused=false,elapsed=0,tick;
function go(n){
 const c=scenes[n],W=st.clientWidth,H=st.clientHeight;
 const tx=W/2-c.z*W*c.x/100,ty=H/2-c.z*H*c.y/100;
 const mx=Math.min(0,Math.max(W-c.z*W,tx)),my=Math.min(0,Math.max(H-c.z*H,ty));
 cam.style.transform=`translate(${mx}px,${my}px) scale(${c.z})`;
 cap.classList.remove('on');
 setTimeout(()=>{T.textContent=c.t;S.textContent=c.s;CTA.hidden=!c.cta;cap.classList.add('on')},500);
}
function play(){
 go(i);
 timer=setTimeout(()=>{i=(i+1)%scenes.length;if(i==0)elapsed=0;play()},scenes[i].d);
}
function loop(){tick=setInterval(()=>{if(!paused){elapsed+=100;bar.style.width=Math.min(100,elapsed/total*100)+'%'}},100)}
function start(){clearTimeout(timer);i=0;elapsed=0;cam.style.transition='none';go(0);cam.offsetWidth;cam.style.transition='';play()}
pp.onclick=()=>{paused=!paused;pp.textContent=paused?'Continuar':'Pausar';
 if(paused){clearTimeout(timer);cam.getAnimations().forEach(a=>a.pause&&a.pause());st.querySelectorAll('.sp').forEach(e=>e.style.animationPlayState='paused')}
 else{st.querySelectorAll('.sp').forEach(e=>e.style.animationPlayState='running');timer=setTimeout(()=>{i=(i+1)%scenes.length;play()},1200)}};
rp.onclick=()=>{paused=false;pp.textContent='Pausar';st.querySelectorAll('.sp').forEach(e=>e.style.animationPlayState='running');start()};
addEventListener('resize',()=>go(i));
loop();start();
</script></body></html>
